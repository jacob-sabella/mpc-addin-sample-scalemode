# MPC Sample Scale Mode addin: settings (the SCALE page and padctl rewrite scale, root and octave_offset in place)
# enabled: 0 to load the library but do nothing (leaves MPC untouched)
enabled=1

# scale: Chromatic, Major, Minor, Harm Minor, Dorian, Blues, Phrygian, Mixolydian
scale=Blues

# root: note name with octave (C3, A#2, Eb4) or MIDI number (0-127)
root=C3

# octave_offset: shift all notes up/down by this many octaves (-4 to 4); 2 puts bank A's first pad on the root
octave_offset=2

# hold_ms: how long to hold 16 Levels to turn Scale on or off (at least 200); a shorter press is a normal 16 Levels press
hold_ms=800

# page: 1 shows the SCALE page on the screen (needs the draw handler addin), 0 for none
page=1

# lock_input: 1 keeps buttons and knobs from MPC while Scale is on, so MPC's screen stays put; 0 lets everything through
lock_input=1

# pass_notes: the buttons (control-surface notes, channel 1) that still reach MPC while Scale is on. Pads, 16 Levels and
# the SCALE page's own controls always do. Default: Shift 49, Rec 73, Overdub 80, Stop 81, Play 82, Play Start 83, 84-87
# pass_notes=49,73,80,81,82,83,84,85,86,87

# padperform_patch: 1 forces the PadPerform "supported" bool (it blocks 16 Levels on the Sample)
padperform_patch=0

# pad_root: the sample's note when MPC's root note for it can't be read (normally it is: see the README); MIDI number
# pad_root=60

# detect_pitch: when the scale starts from the note heard in the sample instead of MPC's root note for it
#   untagged: only a sample at MPC's default, 60 (an untagged WAV)   always: every sample (for files tagged with the
#   wrong note)   off: MPC's root note as is. A sample with no clear pitch keeps MPC's root either way.
detect_pitch=untagged
